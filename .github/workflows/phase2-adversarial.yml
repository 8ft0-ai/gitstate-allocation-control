name: Phase 2 Workstream D adversarial harness

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded Workstream D operation
        required: true
        default: contract_check
        type: choice
        options:
          - contract_check
          - live_authority_gate
          - live_scenario_suite
      expected_control_sha:
        description: Exact trusted control main SHA authorised for this run
        required: true
        type: string
      expected_protocol_sha:
        description: Exact authoritative gitstate-lab protocol SHA
        required: true
        type: string
      attempt_nonce:
        description: Lowercase alphanumeric 6-24 character attempt nonce
        required: true
        type: string
      inventory_attestation_b64:
        description: Fresh owner-authenticated exact two-repository inventory attestation (base64url JSON; live suite only)
        required: false
        default: ""
        type: string

concurrency:
  group: beads-allocation-v0.2-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout immutable dispatched commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Run credential-free Workstream D harness checks
        run: python3 -m unittest discover -s tests -p 'test_workstream_d*.py' -v

  live-authority-gate:
    needs: contract-check
    if: ${{ inputs.operation == 'live_authority_gate' }}
    runs-on: ubuntu-24.04
    environment: phase-2-allocator
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected-main content without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fail closed unless the separate live-execution authority guard is exact
        env:
          ATTEMPT_NONCE: ${{ inputs.attempt_nonce }}
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          EXPECTED_PROTOCOL_SHA: ${{ inputs.expected_protocol_sha }}
          PHASE2_WORKSTREAM_D_EXECUTION_ENABLED: ${{ vars.PHASE2_WORKSTREAM_D_EXECUTION_ENABLED }}
          PROTOCOL_AUTHORITY: 4ad2cebf6c37d21f44e5652a70f5fb4e77da74ae
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from phase2.adversarial import AttemptNamespace, validate_live_gate

          run_id = int(os.environ['RUN_ID'])
          run_attempt = int(os.environ['RUN_ATTEMPT'])
          namespace = f"wd-{run_id}-{run_attempt}-{os.environ['ATTEMPT_NONCE']}"
          AttemptNamespace.parse(namespace, run_id=run_id, run_attempt=run_attempt)

          validate_live_gate(
              repository=os.environ['TRUSTED_REPOSITORY'],
              ref=os.environ['TRUSTED_REF'],
              trusted_sha=os.environ['TRUSTED_SHA'],
              protocol_sha=os.environ['EXPECTED_PROTOCOL_SHA'],
              expected_trusted_sha=os.environ['EXPECTED_CONTROL_SHA'],
              expected_protocol_sha=os.environ['PROTOCOL_AUTHORITY'],
              run_attempt=run_attempt,
              enabled=os.environ.get('PHASE2_WORKSTREAM_D_EXECUTION_ENABLED') == 'true',
          )

          print(json.dumps({
              'attempt_namespace': namespace,
              'credential_accessed': False,
              'live_state_mutated': False,
              'protocol_sha': os.environ['EXPECTED_PROTOCOL_SHA'],
              'status': 'WORKSTREAM_D_LIVE_AUTHORITY_GATE_PASSED',
              'trusted_sha': os.environ['TRUSTED_SHA'],
          }, sort_keys=True, separators=(',', ':')))
          PY

      - name: Preserve the execution boundary
        run: |
          echo 'Workstream D live authority is validated, but live_authority_gate never executes scenarios 1-14.'
          echo 'Use live_scenario_suite only under fresh post-remediation authority and immediate live revalidation.'

  live-scenario-suite:
    needs: contract-check
    if: ${{ inputs.operation == 'live_scenario_suite' }}
    runs-on: ubuntu-24.04
    environment: phase-2-allocator
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected-main content without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fail closed before dependency installation or secret access
        env:
          ATTEMPT_NONCE: ${{ inputs.attempt_nonce }}
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          EXPECTED_PROTOCOL_SHA: ${{ inputs.expected_protocol_sha }}
          PHASE2_WORKSTREAM_D_EXECUTION_ENABLED: ${{ vars.PHASE2_WORKSTREAM_D_EXECUTION_ENABLED }}
          PHASE2_WORKSTREAM_D_FIXTURE_MODE: workstream-d-synthetic-fixture-v1
        run: |
          python3 - <<'PY'
          import os
          from phase2.workstream_d_live import context_from_environment
          context_from_environment(os.environ).validate()
          PY

      - name: Install cryptographically pinned Beads and Dolt binaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/workstream-d-runtime"
          mkdir -p "$ROOT/beads" "$ROOT/dolt"

          curl --fail --location --silent --show-error \
            https://github.com/gastownhall/beads/releases/download/v1.1.0/beads_1.1.0_linux_amd64.tar.gz \
            -o "$ROOT/beads.tar.gz"
          echo "b0f3dd607c3fb989ee08d0a6854fba80d0402971eb108f9af6170bc14d491a34  $ROOT/beads.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$ROOT/beads.tar.gz" -C "$ROOT/beads"

          curl --fail --location --silent --show-error \
            https://github.com/dolthub/dolt/releases/download/v2.1.4/dolt-linux-amd64.tar.gz \
            -o "$ROOT/dolt.tar.gz"
          echo "f3bd2329fc469d9d557af377dc36280da2c4ed13315cc2e4a82fe2b5ae682929  $ROOT/dolt.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$ROOT/dolt.tar.gz" -C "$ROOT/dolt"

          BD_BIN="$(find "$ROOT/beads" -type f -name bd -print -quit)"
          DOLT_BIN="$(find "$ROOT/dolt" -type f -name dolt -print -quit)"
          test -n "$BD_BIN" -a -x "$BD_BIN"
          test -n "$DOLT_BIN" -a -x "$DOLT_BIN"
          "$BD_BIN" --version
          "$DOLT_BIN" version
          printf 'BD_BIN=%s\nDOLT_BIN=%s\n' "$BD_BIN" "$DOLT_BIN" >> "$GITHUB_ENV"

      - name: Install pinned PEP-249 MySQL client in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/workstream-d-venv"
          python3 -m venv "$VENV"
          cat > "$RUNNER_TEMP/workstream-d-requirements.txt" <<'EOF'
          PyMySQL==1.1.2 --hash=sha256:e6b1d89711dd51f8f74b1631fe08f039e7d76cf67a42a323d3178f0f25762ed9
          EOF
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-deps --require-hashes \
            -r "$RUNNER_TEMP/workstream-d-requirements.txt"
          printf 'RUNTIME_PYTHON=%s\n' "$VENV/bin/python" >> "$GITHUB_ENV"

      - name: Execute fixture-only trusted-main Workstream D scenario suite
        env:
          ATTEMPT_NONCE: ${{ inputs.attempt_nonce }}
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          EXPECTED_PROTOCOL_SHA: ${{ inputs.expected_protocol_sha }}
          PHASE2_ALLOCATOR_APP_ID: ${{ vars.PHASE2_ALLOCATOR_APP_ID }}
          PHASE2_ALLOCATOR_INSTALLATION_ID: ${{ vars.PHASE2_ALLOCATOR_INSTALLATION_ID }}
          PHASE2_ALLOCATOR_APP_PRIVATE_KEY: ${{ secrets.PHASE2_ALLOCATOR_APP_PRIVATE_KEY }}
          PHASE2_CONTROL_ISSUE_NUMBER: "1"
          PHASE2_OWNER_INVENTORY_ATTESTATION_B64: ${{ inputs.inventory_attestation_b64 }}
          PHASE2_STATE_REPOSITORY_ID: ${{ secrets.PHASE2_STATE_REPOSITORY_ID }}
          PHASE2_WORKSTREAM_D_EXECUTION_ENABLED: ${{ vars.PHASE2_WORKSTREAM_D_EXECUTION_ENABLED }}
          PHASE2_WORKSTREAM_D_FIXTURE_MODE: workstream-d-synthetic-fixture-v1
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. "$RUNTIME_PYTHON" -m phase2.workstream_d_remediated

      - name: Preserve post-run governance boundary
        if: ${{ always() }}
        run: |
          echo 'The remediated executor emits a non-secret structured success record only after both installation tokens are revoked.'
          echo 'The repository execution-enable variable remains a governance control: remove it immediately after the authorised live run.'
          echo 'No result from this workflow authorises production use or Workstream E.'
